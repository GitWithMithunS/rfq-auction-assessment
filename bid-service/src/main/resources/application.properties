spring.application.name=bid-service
server.port=8082
spring.datasource.url=${BID_DB_URL:jdbc:mysql://localhost:3306/bid_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${BID_DB_USERNAME:root}
spring.datasource.password=${BID_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.time-zone=UTC
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
auction-service.base-url=${AUCTION_SERVICE_URL:http://auction-service}
